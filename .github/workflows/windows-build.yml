name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    defaults:
      run:
        working-directory: LESLocationAgent

    env:
      DOTNET_VERSION: '8.0.x'
      CONFIGURATION: Release
      PLATFORM: x64
      PUBLISH_DIR: publish\x64\Release
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_NOLOGO: '1'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # windows-latest ships .NET SDK 10 pre-installed. Windows App SDK 1.6
      # PRI tasks resolve their DLL from the active SDK directory; that DLL is
      # absent in the SDK 10 layout, causing MSB4062. Removing SDK 10 forces
      # MSBuild to use the SDK 8 we just installed above.
      - name: Remove .NET SDK 10
        shell: pwsh
        run: |
          $sdkRoot = 'C:\Program Files\dotnet\sdk'
          $removed = Get-ChildItem $sdkRoot -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -match '^10\.' }
          foreach ($dir in $removed) {
            Remove-Item $dir.FullName -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Removed SDK $($dir.Name)"
          }
          if (-not $removed) { Write-Host 'No SDK 10.x found.' }
          Write-Host "Active SDK: $(dotnet --version)"

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Restore packages
        run: dotnet restore LESLocationAgent.sln -p:Platform=${{ env.PLATFORM }}

      # Generates a solid-blue 32x32 placeholder .ico so the build succeeds.
      # Replace src\LESLocationAgent\Assets\appicon.ico in the repo with your
      # real branded icon to skip this step.
      - name: Generate placeholder icon
        shell: pwsh
        run: |
          $dir = 'src\LESLocationAgent\Assets'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(32, 32)
          $g   = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(0, 120, 212))
          $g.Dispose()
          $bmp.Save("$dir\appicon.ico")
          $bmp.Dispose()
          Write-Host 'Placeholder icon created.'

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test tests\LESLocationAgent.Tests\LESLocationAgent.Tests.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --no-restore `
            --logger "console;verbosity=normal"

      - name: Publish app (x64, self-contained)
        shell: pwsh
        run: |
          dotnet publish src\LESLocationAgent\LESLocationAgent.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=${{ env.PLATFORM }} `
            -p:PublishSingleFile=false `
            -p:WindowsAppSDKSelfContained=true `
            --output ${{ env.PUBLISH_DIR }}
          $n = (Get-ChildItem '${{ env.PUBLISH_DIR }}' -Recurse -File).Count
          Write-Host "Published $n files."

      - name: Build MSI installer
        shell: pwsh
        run: |
          $pub = Resolve-Path '${{ env.PUBLISH_DIR }}'
          wix build installer\Package.wxs -arch x64 -d "PublishDir=$pub" -o installer\LESLocationAgent.msi
          if (-not (Test-Path 'installer\LESLocationAgent.msi')) {
            throw 'WiX did not produce LESLocationAgent.msi'
          }
          $mb = [Math]::Round((Get-Item 'installer\LESLocationAgent.msi').Length / 1MB, 2)
          Write-Host "MSI built ($mb MB)."

      - name: Compute SHA-256
        id: sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'installer\LESLocationAgent.msi' -Algorithm SHA256).Hash
          Write-Host "SHA-256: $hash"
          "INSTALLER_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append

      # CODE SIGNING - disabled for development builds.
      # To enable: add secrets CODE_SIGN_PFX and CODE_SIGN_PASSWORD,
      # then uncomment the block below.
      #
      # - name: Sign MSI
      #   shell: pwsh
      #   env:
      #     SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX }}
      #     SIGN_PASSWORD:   ${{ secrets.CODE_SIGN_PASSWORD }}
      #   run: |
      #     $pfx = Join-Path $env:TEMP 'sign.pfx'
      #     [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
      #     $tool = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe'
      #     & $tool sign /fd SHA256 /f $pfx /p $env:SIGN_PASSWORD `
      #       /tr http://timestamp.digicert.com /td SHA256 installer\LESLocationAgent.msi
      #     Remove-Item $pfx -Force

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-artifacts | Out-Null
          Copy-Item 'installer\LESLocationAgent.msi'               release-artifacts
          Copy-Item 'scripts\Action1-Location-Sync.ps1'            release-artifacts
          Copy-Item 'scripts\Action1-Install-LESLocationAgent.ps1' release-artifacts
          Copy-Item 'scripts\Action1-LESLocationAgent-Health.ps1'  release-artifacts
          $ts   = Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ'
          $sha  = '${{ github.sha }}'
          $branch = '${{ github.ref_name }}'
          $lines = @(
            "LESLocationAgent.msi SHA-256 : $env:INSTALLER_SHA256",
            "Built                        : $ts",
            "Commit                       : $sha",
            "Branch                       : $branch",
            "",
            "Paste the SHA-256 above into Action1-Install-LESLocationAgent.ps1",
            "as the value of ExpectedSha256."
          )
          $lines | Set-Content 'release-artifacts\SHA256-MANIFEST.txt'
          Get-ChildItem release-artifacts | Format-Table Name, Length -AutoSize

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LESLocationAgent-Windows
          path: LESLocationAgent/release-artifacts/
          retention-days: 90
          if-no-files-found: error
