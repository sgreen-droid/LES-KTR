name: Windows Build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']       # e.g. v1.0.0  — triggers a GitHub Release
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    # Required so the Publish GitHub Release step can create releases and
    # upload assets. Read-only for all other runs (branch pushes).
    permissions:
      contents: write

    defaults:
      run:
        working-directory: LESLocationAgent

    env:
      DOTNET_VERSION: '8.0.x'
      CONFIGURATION: Release
      PLATFORM: x64
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_NOLOGO: '1'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # Visual Studio MSBuild is required for WinUI 3 PRI resource tasks.
      # 'dotnet publish' uses dotnet's bundled MSBuild which lacks the
      # AppxPackage folder; VS MSBuild has it and resolves the task DLL correctly.
      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Restore packages
        run: dotnet restore LESLocationAgent.sln -p:Platform=${{ env.PLATFORM }}

      # Generates a solid-blue 32x32 placeholder .ico so the build succeeds.
      # Replace src\LESLocationAgent\Assets\appicon.ico in the repo with your
      # real branded icon to skip this step.
      - name: Generate placeholder icon
        shell: pwsh
        run: |
          $dir = 'src\LESLocationAgent\Assets'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(32, 32)
          $g   = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(0, 120, 212))
          $g.Dispose()
          $bmp.Save("$dir\appicon.ico")
          $bmp.Dispose()
          Write-Host 'Placeholder icon created.'

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test tests\LESLocationAgent.Tests\LESLocationAgent.Tests.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --no-restore `
            --logger "console;verbosity=normal"

      # Use Visual Studio MSBuild (/t:Publish) instead of 'dotnet publish'.
      # VS MSBuild resolves the WinUI 3 PRI task DLL from its own AppxPackage
      # folder; dotnet's bundled MSBuild does not have that folder.
      - name: Publish app (x64, self-contained)
        shell: pwsh
        run: |
          $publishDir = Join-Path (Get-Location) 'publish\x64\Release'
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          msbuild src\LESLocationAgent\LESLocationAgent.csproj `
            /t:Publish `
            /p:Configuration=${{ env.CONFIGURATION }} `
            /p:Platform=${{ env.PLATFORM }} `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:PublishSingleFile=false `
            /p:WindowsAppSDKSelfContained=true `
            /p:PublishDir="$publishDir\\" `
            /p:RestorePackages=false `
            /verbosity:minimal

          $n = (Get-ChildItem $publishDir -Recurse -File).Count
          Write-Host "Published $n files to $publishDir"

      - name: Build MSI installer
        shell: pwsh
        run: |
          $pub = Resolve-Path 'publish\x64\Release'
          Write-Host "Publish dir: $pub"

          wix build installer\Package.wxs -arch x64 -d "PublishDir=$pub" -o installer\LESLocationAgent.msi

          if (-not (Test-Path 'installer\LESLocationAgent.msi')) {
            throw 'WiX did not produce LESLocationAgent.msi'
          }
          $mb = [Math]::Round((Get-Item 'installer\LESLocationAgent.msi').Length / 1MB, 2)
          Write-Host "MSI built ($mb MB)."

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'installer\LESLocationAgent.msi' -Algorithm SHA256).Hash
          Write-Host "SHA-256: $hash"
          "INSTALLER_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append

      # CODE SIGNING — runs automatically when CODE_SIGN_PFX is set as a
      # GitHub Actions secret.  Development builds that lack the secret are
      # left unsigned without any code change needed.
      #
      # GitHub Actions does not allow 'secrets' in if: conditions, so we
      # detect the secret inside a run: step and write the result as an output.
      - name: Check code-signing secret
        id: check-signing
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX }}
        run: |
          $enabled = ($env:SIGN_PFX_BASE64 -ne '') -and ($null -ne $env:SIGN_PFX_BASE64)
          "signing_enabled=$($enabled.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Code signing enabled: $enabled"

      - name: Sign MSI (production)
        if: steps.check-signing.outputs.signing_enabled == 'true'
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX }}
          SIGN_PASSWORD:   ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          Write-Host 'CODE_SIGN_PFX is present — signing MSI...'
          $pfx = Join-Path $env:TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))

          # Locate signtool.exe — prefer the newest Windows Kit available.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' `
              -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'x64' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            throw 'signtool.exe not found — ensure the Windows SDK is installed on the runner.'
          }
          Write-Host "Using signtool: $signtool"

          & $signtool sign /fd SHA256 /f $pfx /p $env:SIGN_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 `
            installer\LESLocationAgent.msi

          if ($LASTEXITCODE -ne 0) {
            throw "signtool exited with code $LASTEXITCODE"
          }
          Remove-Item $pfx -Force

          # Verify the signature is present and trusted.
          & $signtool verify /pa /v installer\LESLocationAgent.msi
          if ($LASTEXITCODE -ne 0) {
            throw "Signature verification failed (exit $LASTEXITCODE)."
          }
          Write-Host 'MSI signed and verified successfully.'

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-artifacts | Out-Null
          Copy-Item 'installer\LESLocationAgent.msi'               release-artifacts
          Copy-Item 'scripts\Action1-Location-Sync.ps1'            release-artifacts
          Copy-Item 'scripts\Action1-Install-LESLocationAgent.ps1' release-artifacts
          Copy-Item 'scripts\Action1-LESLocationAgent-Health.ps1'  release-artifacts
          $ts     = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $sha    = '${{ github.sha }}'
          $branch = '${{ github.ref_name }}'
          $lines  = @(
            "LESLocationAgent.msi SHA-256 : $env:INSTALLER_SHA256",
            "Built                        : $ts",
            "Commit                       : $sha",
            "Branch / Tag                 : $branch",
            "",
            "Paste the SHA-256 above into Action1-Install-LESLocationAgent.ps1",
            "as the value of ExpectedSha256."
          )
          $lines | Set-Content 'release-artifacts\SHA256-MANIFEST.txt'
          Get-ChildItem release-artifacts | Format-Table Name, Length -AutoSize

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: LESLocationAgent-Windows
          path: LESLocationAgent/release-artifacts/
          retention-days: 90
          if-no-files-found: error

      # ----------------------------------------------------------------
      # Publish GitHub Release — only runs when a v*.*.* tag is pushed.
      # The MSI, SHA-256 manifest, and all three Action1 scripts are
      # attached as release assets with permanent public download URLs.
      # ----------------------------------------------------------------
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LES Location Agent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            LESLocationAgent/release-artifacts/LESLocationAgent.msi
            LESLocationAgent/release-artifacts/SHA256-MANIFEST.txt
            LESLocationAgent/release-artifacts/Action1-Install-LESLocationAgent.ps1
            LESLocationAgent/release-artifacts/Action1-Location-Sync.ps1
            LESLocationAgent/release-artifacts/Action1-LESLocationAgent-Health.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
