openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recovery-auth
    description: Recovery console session operations
  - name: recovery
    description: Recovery endpoint, incident, and evidence operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /recovery/auth/session:
    get:
      operationId: getRecoverySession
      tags: [recovery-auth]
      summary: Check the current recovery console session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySession"
    post:
      operationId: createRecoverySession
      tags: [recovery-auth]
      summary: Unlock the recovery console
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryLogin"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySession"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteRecoverySession
      tags: [recovery-auth]
      summary: Lock the recovery console
      responses:
        "204":
          description: Session cleared
  /recovery/summary:
    get:
      operationId: getRecoverySummary
      tags: [recovery]
      summary: Get recovery fleet status totals
      responses:
        "200":
          description: Fleet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoverySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/Action1Unavailable"
  /recovery/readiness:
    get:
      operationId: getAction1Readiness
      tags: [recovery]
      summary: Check Action1 recovery data readiness
      description: Confirms Action1 authentication and recovery read access without returning recovery records
      responses:
        "200":
          description: Safe readiness status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action1Readiness"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /recovery/devices:
    get:
      operationId: listRecoveryDevices
      tags: [recovery]
      summary: List Action1 endpoints with recovery data
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: recoveryStatus
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: agentHealth
          in: query
          required: false
          schema:
            type: string
            maxLength: 80
        - name: integrity
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
        - name: freshness
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, STALE, ALL]
      responses:
        "200":
          description: Matching endpoint records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryDeviceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/Action1Unavailable"
  /recovery/devices/{endpointId}:
    get:
      operationId: getRecoveryDevice
      tags: [recovery]
      summary: Get one recovery endpoint with labeled location details
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
      responses:
        "200":
          description: Endpoint record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryDevice"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Endpoint not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          $ref: "#/components/responses/Action1Unavailable"
  /recovery/devices/{endpointId}/location-history:
    get:
      operationId: getRecoveryDeviceLocationHistory
      tags: [recovery]
      summary: Get time-bounded, last-known observations for one Action1 endpoint
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Matching persisted last-known observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryLocationHistory"
        "400":
          description: Invalid history date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /recovery/devices/{endpointId}/location-history/export:
    get:
      operationId: exportRecoveryDeviceLocationHistory
      tags: [recovery]
      summary: Export time-bounded, last-known observations for one Action1 endpoint
      parameters:
        - name: endpointId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv, print]
            default: json
      responses:
        "200":
          description: JSON, CSV, or print-ready HTML location history export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryLocationHistoryExport"
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
        "400":
          description: Invalid history date range or export request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /recovery/location-history:
    get:
      operationId: listRecoveryLocationHistory
      tags: [recovery]
      summary: List persisted last-known observations for the fleet or selected Action1 endpoints
      parameters:
        - name: endpointIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 160
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Matching persisted last-known observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryLocationHistory"
        "400":
          description: Invalid history date range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /recovery/location-history/export:
    get:
      operationId: exportRecoveryLocationHistory
      tags: [recovery]
      summary: Export persisted last-known observations for the fleet or selected endpoints
      parameters:
        - name: endpointIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              minLength: 1
              maxLength: 160
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv, print]
            default: json
      responses:
        "200":
          description: JSON, CSV, or print-ready HTML location history export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryLocationHistoryExport"
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
        "400":
          description: Invalid history date range or export request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /recovery/incidents:
    get:
      operationId: listRecoveryIncidents
      tags: [recovery]
      summary: List recovery incidents
      responses:
        "200":
          description: Recovery incidents ordered by most recently updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryIncidentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createRecoveryIncident
      tags: [recovery]
      summary: Create an incident and capture current endpoint evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryIncidentInput"
      responses:
        "201":
          description: Created incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryIncidentDetail"
        "400":
          description: Invalid incident data or unknown endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/Action1Unavailable"
  /recovery/incidents/{incidentId}:
    get:
      operationId: getRecoveryIncident
      tags: [recovery]
      summary: Get an incident with captured endpoint evidence and audit records
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: Incident detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryIncidentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateRecoveryIncident
      tags: [recovery]
      summary: Update incident ownership, status, case information, or add a note
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryIncidentUpdate"
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryIncidentDetail"
        "400":
          description: Invalid incident update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /recovery/incidents/{incidentId}/export:
    post:
      operationId: exportRecoveryIncident
      tags: [recovery]
      summary: Generate a controlled incident evidence export
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryEvidenceExportRequest"
      responses:
        "200":
          description: JSON, CSV, or print-ready HTML evidence export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryEvidenceExport"
            text/csv:
              schema:
                type: string
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  parameters:
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: An authorized recovery console session is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Too many failed login attempts
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Action1Unavailable:
      description: Action1 could not be reached or did not accept the API credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required: [error, message]
    RecoveryLogin:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required: [password]
    RecoverySession:
      type: object
      properties:
        authenticated:
          type: boolean
        expiresAt:
          type: ["string", "null"]
          format: date-time
      required: [authenticated, expiresAt]
    RecoveryDevice:
      type: object
      properties:
        endpointId:
          type: string
        computerName:
          type: string
        organizationId:
          type: string
        organizationName:
          type: string
        endpointStatus:
          type: string
        operatingSystem:
          type: string
        lastSeen:
          type: ["string", "null"]
        deviceId:
          type: ["string", "null"]
          description: Action1 device identifier when reported. This is a secondary identifier; endpointId remains the canonical management key.
        serialNumber:
          type: ["string", "null"]
        manufacturer:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        isDuplicateComputerName:
          type: boolean
        agentVersion:
          type: ["string", "null"]
        agentHealth:
          type: ["string", "null"]
        recoveryStatus:
          type: ["string", "null"]
        locationStatus:
          type: ["string", "null"]
        locationIntegrity:
          type: ["string", "null"]
        locationAgeMinutes:
          type: ["string", "null"]
        locationPermission:
          type: ["string", "null"]
        locationUpdated:
          type: ["string", "null"]
        lastAttempt:
          type: ["string", "null"]
        lastSuccess:
          type: ["string", "null"]
        locationSequence:
          type: ["string", "null"]
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        accuracy:
          type: ["string", "null"]
        streetAddress:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        addressSource:
          type: ["string", "null"]
        nearestAddress:
          type: ["string", "null"]
        crossStreets:
          type: ["string", "null"]
        addressPrecision:
          type: ["string", "null"]
        locationQuality:
          type: ["string", "null"]
        locationSource:
          type: ["string", "null"]
        positionSource:
          type: ["string", "null"]
        locationError:
          type: ["string", "null"]
        mapLink:
          type: ["string", "null"]
        mapEmbedUrl:
          type: ["string", "null"]
        locationCoordinates:
          type: ["string", "null"]
        locationSummary:
          type: ["string", "null"]
        isMapSafe:
          type: boolean
      required:
        - endpointId
        - computerName
        - organizationId
        - organizationName
        - endpointStatus
        - operatingSystem
        - lastSeen
        - deviceId
        - serialNumber
        - manufacturer
        - model
        - isDuplicateComputerName
        - agentVersion
        - agentHealth
        - recoveryStatus
        - locationStatus
        - locationIntegrity
        - locationAgeMinutes
        - locationPermission
        - locationUpdated
        - lastAttempt
        - lastSuccess
        - locationSequence
        - latitude
        - longitude
        - accuracy
        - streetAddress
        - city
        - state
        - postalCode
        - country
        - addressSource
        - nearestAddress
        - crossStreets
        - addressPrecision
        - locationQuality
        - locationSource
        - positionSource
        - locationError
        - mapLink
        - mapEmbedUrl
        - locationCoordinates
        - locationSummary
        - isMapSafe
    RecoveryDeviceList:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryDevice"
        refreshedAt:
          type: string
          format: date-time
        source:
          type: string
      required: [devices, refreshedAt, source]
    RecoveryLocationObservation:
      type: object
      properties:
        id:
          type: string
        endpointId:
          type: string
        deviceId:
          type: ["string", "null"]
        computerName:
          type: string
        organizationId:
          type: string
        organizationName:
          type: string
        serialNumber:
          type: ["string", "null"]
        manufacturer:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        operatingSystem:
          type: string
        agentVersion:
          type: ["string", "null"]
        capturedAt:
          type: string
          format: date-time
        sourceRefreshedAt:
          type: string
          format: date-time
        locationObservedAt:
          type: ["string", "null"]
          format: date-time
        lastSeenAt:
          type: ["string", "null"]
          format: date-time
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        accuracy:
          type: ["string", "null"]
        streetAddress:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        addressSource:
          type: ["string", "null"]
        nearestAddress:
          type: ["string", "null"]
        crossStreets:
          type: ["string", "null"]
        addressPrecision:
          type: ["string", "null"]
        locationCoordinates:
          type: ["string", "null"]
        locationStatus:
          type: ["string", "null"]
        locationIntegrity:
          type: ["string", "null"]
        locationQuality:
          type: ["string", "null"]
        locationSource:
          type: ["string", "null"]
        positionSource:
          type: ["string", "null"]
        locationPermission:
          type: ["string", "null"]
        locationSequence:
          type: ["string", "null"]
        locationAgeMinutes:
          type: ["string", "null"]
        locationError:
          type: ["string", "null"]
        locationSummary:
          type: ["string", "null"]
        isMapSafe:
          type: boolean
      required:
        - id
        - endpointId
        - deviceId
        - computerName
        - organizationId
        - organizationName
        - serialNumber
        - manufacturer
        - model
        - operatingSystem
        - agentVersion
        - capturedAt
        - sourceRefreshedAt
        - locationObservedAt
        - lastSeenAt
        - latitude
        - longitude
        - accuracy
        - streetAddress
        - city
        - state
        - postalCode
        - country
        - addressSource
        - nearestAddress
        - crossStreets
        - addressPrecision
        - locationCoordinates
        - locationStatus
        - locationIntegrity
        - locationQuality
        - locationSource
        - positionSource
        - locationPermission
        - locationSequence
        - locationAgeMinutes
        - locationError
        - locationSummary
        - isMapSafe
    RecoveryLocationHistory:
      type: object
      properties:
        observations:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryLocationObservation"
        observationCount:
          type: number
          minimum: 0
        from:
          type: ["string", "null"]
          format: date-time
        to:
          type: ["string", "null"]
          format: date-time
      required: [observations, observationCount, from, to]
    RecoveryLocationMovement:
      type: object
      properties:
        priorObservationId:
          type: string
        priorObservationAt:
          type: string
          format: date-time
        distanceMeters:
          type: number
          minimum: 0
        elapsedMinutes:
          type: ["number", "null"]
          minimum: 0
        apparentSpeedKmh:
          type: ["number", "null"]
          minimum: 0
        assessment:
          type: string
          enum: [FIRST_COORDINATE, NO_MATERIAL_CHANGE, COORDINATE_CHANGE]
      required:
        - priorObservationId
        - priorObservationAt
        - distanceMeters
        - elapsedMinutes
        - apparentSpeedKmh
        - assessment
    RecoveryLocationExportObservation:
      allOf:
        - $ref: "#/components/schemas/RecoveryLocationObservation"
        - type: object
          properties:
            observationNumber:
              type: number
              minimum: 1
            observationTimeBasis:
              type: string
              enum:
                - ENDPOINT_LOCATION_OBSERVED_AT
                - ACTION1_SOURCE_REFRESHED_AT
            movementFromPrevious:
              oneOf:
                - $ref: "#/components/schemas/RecoveryLocationMovement"
                - type: "null"
          required:
            - observationNumber
            - observationTimeBasis
            - movementFromPrevious
    RecoveryLocationEndpointSummary:
      type: object
      properties:
        endpointId:
          type: string
        deviceId:
          type: ["string", "null"]
        computerNames:
          type: array
          items:
            type: string
        organizationName:
          type: string
        observationCount:
          type: number
          minimum: 0
        coordinateObservationCount:
          type: number
          minimum: 0
        firstObservationAt:
          type: ["string", "null"]
          format: date-time
        lastObservationAt:
          type: ["string", "null"]
          format: date-time
        firstCoordinate:
          type: ["string", "null"]
        lastCoordinate:
          type: ["string", "null"]
        apparentDistanceMeters:
          type: number
          minimum: 0
        movementSegmentCount:
          type: number
          minimum: 0
        maxApparentSpeedKmh:
          type: ["number", "null"]
          minimum: 0
        locationStatuses:
          type: array
          items:
            type: string
        integrityStates:
          type: array
          items:
            type: string
        city:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        postalCode:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        nearestAddress:
          type: ["string", "null"]
        crossStreets:
          type: ["string", "null"]
      required:
        - endpointId
        - deviceId
        - computerNames
        - organizationName
        - observationCount
        - coordinateObservationCount
        - firstObservationAt
        - lastObservationAt
        - firstCoordinate
        - lastCoordinate
        - apparentDistanceMeters
        - movementSegmentCount
        - maxApparentSpeedKmh
        - locationStatuses
        - integrityStates
        - city
        - state
        - postalCode
        - country
        - nearestAddress
        - crossStreets
    RecoveryLocationHistoryCoverage:
      type: object
      properties:
        endpointCount:
          type: number
          minimum: 0
        endpointsWithCoordinates:
          type: number
          minimum: 0
        observationCount:
          type: number
          minimum: 0
        coordinateObservationCount:
          type: number
          minimum: 0
        movementSegmentCount:
          type: number
          minimum: 0
        firstObservationAt:
          type: ["string", "null"]
          format: date-time
        lastObservationAt:
          type: ["string", "null"]
          format: date-time
        totalApparentDistanceMeters:
          type: number
          minimum: 0
        endpointSummaries:
          type: array
          items:
            $ref: "#/components/schemas/RecoveryLocationEndpointSummary"
      required:
        - endpointCount
        - endpointsWithCoordinates
        - observationCount
        - coordinateObservationCount
        - movementSegmentCount
        - firstObservationAt
        - lastObservationAt
        - totalApparentDistanceMeters
        - endpointSummaries
    RecoveryLocationHistoryExport:
      type: object
      properties:
        exportId:
          type: string
        schemaVersion:
          type: string
        generatedAt:
          type: string
          format: date-time
        source:
          type: string
        scope:
          type: string
          enum: [FLEET, SELECTED, SINGLE]
        endpointIds:
          type: array
          items:
            type: string
        from:
          type: ["string", "null"]
          format: date-time
