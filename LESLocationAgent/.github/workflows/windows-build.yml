name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    # All 'run' steps execute inside the LESLocationAgent subfolder,
    # so paths in commands match the local project layout exactly.
    defaults:
      run:
        working-directory: LESLocationAgent

    env:
      DOTNET_VERSION: '8.0.x'
      CONFIGURATION: Release
      PLATFORM: x64
      PUBLISH_DIR: publish\x64\Release
      # Prevent dotnet from finding the pre-installed SDK 10 on windows-latest.
      # With MULTILEVEL_LOOKUP=0, dotnet only uses the SDK installed by setup-dotnet.
      DOTNET_MULTILEVEL_LOOKUP: '0'
      DOTNET_NOLOGO: '1'

    steps:

      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. .NET 8 SDK
      # ----------------------------------------------------------------
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ----------------------------------------------------------------
      # 3. WiX Toolset v5
      # ----------------------------------------------------------------
      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      # ----------------------------------------------------------------
      # 4. Restore NuGet packages
      # ----------------------------------------------------------------
      - name: Restore packages
        run: dotnet restore LESLocationAgent.sln -p:Platform=${{ env.PLATFORM }}

      # ----------------------------------------------------------------
      # 5. Generate placeholder icon BEFORE compilation.
      #    The .csproj references Assets\appicon.ico at build time.
      #    Replace src\LESLocationAgent\Assets\appicon.ico in the repo
      #    with your real branded .ico file to skip this step.
      # ----------------------------------------------------------------
      - name: Generate placeholder icon
        shell: pwsh
        run: |
          $assetsDir = "src\LESLocationAgent\Assets"
          New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null

          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(32, 32)
          $g   = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(0, 120, 212))
          $g.Dispose()
          $icoPath = "$assetsDir\appicon.ico"
          $bmp.Save($icoPath)
          $bmp.Dispose()
          Write-Host "Placeholder icon created at $icoPath"

      # ----------------------------------------------------------------
      # 6. Run unit tests (Core library, targets net8.0, runs on any OS)
      # ----------------------------------------------------------------
      - name: Run unit tests
        run: |
          dotnet test tests\LESLocationAgent.Tests\LESLocationAgent.Tests.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --no-restore `
            --logger "console;verbosity=normal"

      # ----------------------------------------------------------------
      # 7. Publish — self-contained x64
      #    WindowsAppSDKSelfContained bundles the runtime so target PCs
      #    need no pre-installed Windows App SDK.
      # ----------------------------------------------------------------
      - name: Publish app (x64 Release, self-contained)
        shell: pwsh
        run: |
          dotnet publish src\LESLocationAgent\LESLocationAgent.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=${{ env.PLATFORM }} `
            -p:PublishSingleFile=false `
            -p:WindowsAppSDKSelfContained=true `
            --output ${{ env.PUBLISH_DIR }}

          $count = (Get-ChildItem '${{ env.PUBLISH_DIR }}' -Recurse -File).Count
          Write-Host "Published $count files to ${{ env.PUBLISH_DIR }}"

      # ----------------------------------------------------------------
      # 8. Build MSI with WiX v5
      # ----------------------------------------------------------------
      - name: Build MSI installer
        shell: pwsh
        run: |
          $pub = Resolve-Path '${{ env.PUBLISH_DIR }}'
          Write-Host "Publish dir: $pub"

          wix build installer\Package.wxs `
            -arch x64 `
            -d "PublishDir=$pub" `
            -o installer\LESLocationAgent.msi

          if (-not (Test-Path 'installer\LESLocationAgent.msi')) {
            throw 'WiX build did not produce LESLocationAgent.msi'
          }
          $mb = [Math]::Round((Get-Item 'installer\LESLocationAgent.msi').Length / 1MB, 2)
          Write-Host "MSI built ($mb MB)"

      # ----------------------------------------------------------------
      # 9. SHA-256 checksum
      # ----------------------------------------------------------------
      - name: Compute SHA-256
        id: sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'installer\LESLocationAgent.msi' -Algorithm SHA256).Hash
          Write-Host "SHA-256: $hash"
          "INSTALLER_SHA256=$hash" | Out-File $env:GITHUB_ENV -Append

      # CODE SIGNING — disabled for development builds.
      # To enable: add secrets CODE_SIGN_PFX and CODE_SIGN_PASSWORD,
      # then uncomment the block below.
      #
      # - name: Sign MSI
      #   shell: pwsh
      #   env:
      #     SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX }}
      #     SIGN_PASSWORD:   ${{ secrets.CODE_SIGN_PASSWORD }}
      #   run: |
      #     $pfx = Join-Path $env:TEMP 'sign.pfx'
      #     [IO.File]::WriteAllBytes($pfx,
      #       [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
      #     $tool = 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe'
      #     & $tool sign /fd SHA256 /f $pfx /p $env:SIGN_PASSWORD `
      #       /tr http://timestamp.digicert.com /td SHA256 `
      #       installer\LESLocationAgent.msi
      #     Remove-Item $pfx -Force

      # ----------------------------------------------------------------
      # 10. Collect release artifacts
      # ----------------------------------------------------------------
      - name: Collect release artifacts
        shell: pwsh
        run: |
          $out = 'release-artifacts'
          New-Item -ItemType Directory -Path $out | Out-Null

          Copy-Item 'installer\LESLocationAgent.msi'                 $out
          Copy-Item 'scripts\Action1-Location-Sync.ps1'              $out
          Copy-Item 'scripts\Action1-Install-LESLocationAgent.ps1'   $out
          Copy-Item 'scripts\Action1-LESLocationAgent-Health.ps1'    $out

          @"
LESLocationAgent.msi SHA-256 : $env:INSTALLER_SHA256
Built                         : $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ')
Commit                        : ${{ github.sha }}
Branch                        : ${{ github.ref_name }}

Paste the SHA-256 above into Action1-Install-LESLocationAgent.ps1
as the value of `$ExpectedSha256.
"@ | Set-Content "$out\SHA256-MANIFEST.txt"

          Write-Host 'Artifacts:'
          Get-ChildItem $out | Format-Table Name, Length -AutoSize

      # ----------------------------------------------------------------
      # 11. Upload artifact — download from Actions tab when build is green
      # ----------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LESLocationAgent-Windows
          path: LESLocationAgent/release-artifacts/
          retention-days: 90
          if-no-files-found: error
