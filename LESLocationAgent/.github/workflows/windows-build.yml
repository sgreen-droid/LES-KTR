name: Windows Build

# Trigger on push to main, or manually from the Actions tab
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Windows x64)
    runs-on: windows-latest

    env:
      DOTNET_VERSION: '8.0.x'
      CONFIGURATION: Release
      PLATFORM: x64
      PUBLISH_DIR: publish\x64\Release

    steps:

      # ----------------------------------------------------------------
      # 1. Checkout repository
      # ----------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Set up .NET 8 SDK
      # ----------------------------------------------------------------
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ----------------------------------------------------------------
      # 3. Install WiX Toolset v5
      # ----------------------------------------------------------------
      - name: Install WiX v5
        run: dotnet tool install --global wix --version 5.0.2

      # ----------------------------------------------------------------
      # 4. Restore NuGet packages
      #    Windows App SDK arrives as a NuGet package — no extra install needed.
      # ----------------------------------------------------------------
      - name: Restore packages
        run: dotnet restore LESLocationAgent.sln -p:Platform=${{ env.PLATFORM }}

      # ----------------------------------------------------------------
      # 4b. Verify Action1 scripts without requiring an Action1 tenant.
      # ----------------------------------------------------------------
      - name: Test Action1 scripts
        shell: pwsh
        run: |
          .\tests\Action1-Location-Sync.Tests.ps1
          .\tests\Action1-Deployment-Scripts.Tests.ps1

      # ----------------------------------------------------------------
      # 5. Run unit tests
      #    The Core library tests target net8.0 and run on any OS.
      # ----------------------------------------------------------------
      - name: Run unit tests
        run: |
          dotnet test tests\LESLocationAgent.Tests\LESLocationAgent.Tests.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --no-restore `
            --logger "console;verbosity=normal"

      # ----------------------------------------------------------------
      # 6. Publish the app — self-contained, x64
      #    -p:WindowsAppSDKSelfContained=true bundles the Windows App SDK
      #    runtime so target PCs need no separate runtime installation.
      # ----------------------------------------------------------------
      - name: Publish app (x64 Release, self-contained)
        run: |
          dotnet publish src\LESLocationAgent\LESLocationAgent.csproj `
            --configuration ${{ env.CONFIGURATION }} `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=${{ env.PLATFORM }} `
            -p:PublishSingleFile=false `
            -p:WindowsAppSDKSelfContained=true `
            --output ${{ env.PUBLISH_DIR }}

          $fileCount = (Get-ChildItem '${{ env.PUBLISH_DIR }}' -Recurse -File).Count
          Write-Host "Published $fileCount files to ${{ env.PUBLISH_DIR }}"

      # ----------------------------------------------------------------
      # 7. Generate placeholder app icon (so the build succeeds without
      #    a custom icon file). Replace Assets\appicon.ico in the repo
      #    with your real branded icon to remove this step.
      # ----------------------------------------------------------------
      - name: Generate placeholder icon
        shell: pwsh
        run: |
          $assetsSrc  = "src\LESLocationAgent\Assets"
          $assetsDest = "${{ env.PUBLISH_DIR }}\Assets"
          New-Item -ItemType Directory -Path $assetsSrc  -Force | Out-Null
          New-Item -ItemType Directory -Path $assetsDest -Force | Out-Null

          # Create a simple 32x32 blue square ICO via System.Drawing
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(32, 32)
          $g   = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::FromArgb(0, 120, 212))
          $g.Dispose()
          $icoPath = "$assetsSrc\appicon.ico"
          $bmp.Save($icoPath)
          $bmp.Dispose()

          Copy-Item $icoPath "$assetsDest\appicon.ico" -Force
          Write-Host "Placeholder icon written to $icoPath and $assetsDest\appicon.ico"

      # ----------------------------------------------------------------
      # 8. Build MSI with WiX v5
      # ----------------------------------------------------------------
      # Verify that the Windows App SDK was bundled into the publish output.
      # WindowsAppSDKSelfContained=true should include Microsoft.ui.xaml.dll;
      # if it is absent the app will silently fail to start on clean Windows PCs.
      - name: Verify Windows App SDK DLLs are present
        shell: pwsh
        run: |
          $publishDir = Join-Path (Get-Location) 'publish\x64\Release'
          $requiredRuntimeFiles = @(
            'Microsoft.ui.xaml.dll',
            'Microsoft.WindowsAppRuntime.dll'
          )

          foreach ($name in $requiredRuntimeFiles) {
            $runtimeFile = Join-Path $publishDir $name
            if (Test-Path -LiteralPath $runtimeFile -PathType Leaf) {
              Write-Host "Windows App SDK DLL confirmed beside the app: $runtimeFile"
              continue
            }

            Write-Error @"
          ================================================================
          MISSING: $name was not found beside LESLocationAgent.exe.
          The self-contained MSI would be incomplete and the app could fail to
          start on the target PC.

          Fix options:
            1. Confirm /p:WindowsAppSDKSelfContained=true is accepted by the
               SDK version on this runner (check MSBuild output above).
            2. Inspect the publish output before building the MSI. The required
               DLL must be beside LESLocationAgent.exe, not in a subfolder.
          ================================================================
          "@
            exit 1
          }
          }

          # Also check for a few other core WinAppSDK DLLs for extra confidence.
          $extraChecks = @(
            'Microsoft.WindowsAppRuntime.Release.dll',
            'WinRT.Runtime.dll'
          )
          foreach ($name in $extraChecks) {
            $found = Get-ChildItem -Path $publishDir -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Write-Host "Confirmed: $name"
            } else {
              Write-Warning "$name not found — bundle may be incomplete."
            }
          }

          $dllCount = (Get-ChildItem $publishDir -Recurse -Filter '*.dll').Count
          Write-Host "Total DLLs in publish output: $dllCount"

      - name: Build MSI installer
        shell: pwsh
        run: |
          $publishAbsPath = Resolve-Path '${{ env.PUBLISH_DIR }}'
          Write-Host "Publish directory: $publishAbsPath"

          wix build installer\Package.wxs `
            -arch x64 `
            -d "PublishDir=$publishAbsPath" `
            -o installer\LESLocationAgent.msi

          if (-not (Test-Path 'installer\LESLocationAgent.msi')) {
            throw 'WiX build did not produce LESLocationAgent.msi'
          }

          $sizeMB = [Math]::Round((Get-Item 'installer\LESLocationAgent.msi').Length / 1MB, 2)
          Write-Host "Installer built: installer\LESLocationAgent.msi ($sizeMB MB)"

      # ----------------------------------------------------------------
      # 9. Sign MSI (production) — skipped automatically when
      #     CODE_SIGN_PFX secret is absent (e.g. development builds).
      #
      # To enable signing:
      #   1. Obtain a code-signing certificate (DigiCert, Sectigo, etc.).
      #   2. Export as .pfx and base64-encode it:
      #        [Convert]::ToBase64String([IO.File]::ReadAllBytes('cert.pfx')) | clip
      #   3. Add GitHub repository secrets:
      #        CODE_SIGN_PFX       — the base64 string
      #        CODE_SIGN_PASSWORD  — the PFX password
      #   The step runs automatically on the next push; no code change needed.
      # ----------------------------------------------------------------
      - name: Sign MSI (production)
        if: ${{ secrets.CODE_SIGN_PFX != '' }}
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX }}
          SIGN_PASSWORD:   ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath,
            [Convert]::FromBase64String($env:SIGN_PFX_BASE64))

          # Locate signtool.exe dynamically — the Windows Kits version changes
          # across GitHub-hosted runner images.
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' `
            -Recurse -Filter 'signtool.exe' |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) { throw 'signtool.exe not found in Windows Kits' }
          Write-Host "Using signtool: $signtool"

          & $signtool sign /fd SHA256 /f $pfxPath /p $env:SIGN_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 `
            installer\LESLocationAgent.msi

          if ($LASTEXITCODE -ne 0) { throw "signtool exited with code $LASTEXITCODE" }

          Remove-Item $pfxPath -Force
          Write-Host 'MSI signed successfully.'

      # ----------------------------------------------------------------
      # 10. Compute the final MSI hash after optional signing.
      # ----------------------------------------------------------------
      - name: Compute final SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path 'installer\LESLocationAgent.msi' -Algorithm SHA256).Hash
          Write-Host "Final installer SHA-256: $hash"
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ----------------------------------------------------------------
      # 11. Collect all release artifacts into one folder
      # ----------------------------------------------------------------
      - name: Collect release artifacts
        shell: pwsh
        run: |
          $out = 'release-artifacts'
          New-Item -ItemType Directory -Path $out | Out-Null

          Copy-Item 'installer\LESLocationAgent.msi'                 $out
          Copy-Item 'scripts\Action1-Location-Sync.ps1'              $out
          Copy-Item 'scripts\Action1-LESLocationAgent-Health.ps1'    $out

          # Tagged releases include an Action1 installer script that is already
          # pinned to this exact release URL and final post-signing SHA-256.
          $installerScript = Get-Content 'scripts\Action1-Install-LESLocationAgent.ps1' -Raw
          if ('${{ github.ref }}' -like 'refs/tags/*') {
            $releaseUrl = 'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LESLocationAgent.msi'
            $installerScript = $installerScript.Replace('__INSTALLER_URL__', $releaseUrl)
            $installerScript = $installerScript.Replace('__INSTALLER_SHA256__', $env:INSTALLER_SHA256)
          }
          $installerScript | Set-Content (Join-Path $out 'Action1-Install-LESLocationAgent.ps1') -Encoding UTF8

          @"
LESLocationAgent.msi SHA-256 : $env:INSTALLER_SHA256
Built                         : $(Get-Date -AsUTC -Format 'yyyy-MM-ddTHH:mm:ssZ')
Commit                        : ${{ github.sha }}
Branch                        : ${{ github.ref_name }}

HOW TO USE THIS HASH
--------------------
For tagged releases, Action1-Install-LESLocationAgent.ps1 is already
configured with this release URL and the final hash. Do not change it.

For a privately hosted MSI, set both the trusted HTTPS InstallerUrl and:

  `$ExpectedSha256 = '$env:INSTALLER_SHA256'
"@  | Set-Content (Join-Path $out 'SHA256-MANIFEST.txt')

          Write-Host 'Release artifacts:'
          Get-ChildItem $out | Format-Table Name, Length -AutoSize

      # ----------------------------------------------------------------
      # 11. Upload as a GitHub Actions artifact
      #
      # After the build succeeds:
      #   Actions tab → this run → scroll to Artifacts → LESLocationAgent-Windows
      #   Click to download the ZIP containing the MSI and PowerShell scripts.
      # ----------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LESLocationAgent-Windows
          path: release-artifacts\
          retention-days: 90
          if-no-files-found: error

      # Tags are installable releases: attach the MSI, Action1 scripts, and
      # checksum manifest directly to a GitHub Release.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts\* `
            --title "LES Location Agent ${{ github.ref_name }}" `
            --generate-notes
